
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Power7 Demo Checkout</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 550px;
      margin: 60px auto;
      padding: 20px;
      background: #f2f0e8;
      color: #17211c;
    }

    .checkout {
      background: white;
      padding: 30px;
      border-radius: 12px;
    }

    .product {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .product input {
      width: auto;
      margin: 0;
    }

    .order-summary {
      background: #f2f0e8;
      padding: 16px;
      margin: 20px 0;
      border-radius: 8px;
    }

    .checkout-field {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      background: #315c47;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #244735;
    }

    #result {
      margin-top: 16px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="checkout">

    <h1>Power7 Demo Checkout</h1>
    <p>Practice only — no real orders or payments.</p>

    <h2>Demo Products</h2>

    <label class="product">
      <input type="checkbox"
             name="product"
             value="Demo Product A">
      Demo Product A — $20 AUD
    </label>

    <label class="product">
      <input type="checkbox"
             name="product"
             value="Demo Product B">
      Demo Product B — $35 AUD
    </label>

    <label class="product">
      <input type="checkbox"
             name="product"
             value="Demo Product C">
      Demo Product C — $50 AUD
    </label>

    <div class="order-summary">
      <h2>Your Order Summary</h2>
      <p id="selected-products">
        No products selected
      </p>
      <p>
        <strong>
          Total: $<span id="order-total">0.00</span> AUD
        </strong>
      </p>
    </div>

    <h2>Practice Checkout</h2>

    <form id="demo-form">
      <input
        class="checkout-field"
        id="customer-name"
        placeholder="Customer name"
        required
      >

      <input
        class="checkout-field"
        id="customer-email"
        type="email"
        placeholder="Email"
        required
      >

      <button type="submit">
        Submit Demo Order
      </button>
    </form>

    <p id="result" role="status"></p>

  </div>

  <script>
    const demoPrices = {
      "Demo Product A": 20,
      "Demo Product B": 35,
      "Demo Product C": 50
    };

    const productCheckboxes =
      document.querySelectorAll('input[name="product"]');

    const form = document.getElementById("demo-form");
    const result = document.getElementById("result");

    function getSelectedProducts() {
      return [...productCheckboxes]
        .filter(checkbox => checkbox.checked)
        .map(checkbox => checkbox.value);
    }

    function updateOrderSummary() {
      const selected = getSelectedProducts();

      const total = selected.reduce(
        (sum, name) => sum + demoPrices[name],
        0
      );

      document.getElementById("selected-products")
        .textContent = selected.length
          ? selected.join(", ")
          : "No products selected";

      document.getElementById("order-total")
        .textContent = total.toFixed(2);
    }

    productCheckboxes.forEach(checkbox => {
      checkbox.addEventListener(
        "change",
        updateOrderSummary
      );
    });

    updateOrderSummary();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const selectedProducts = getSelectedProducts();

      if (selectedProducts.length === 0) {
        result.textContent =
          "Please select at least one product.";
        return;
      }

      result.textContent = "Submitting demo order...";

      try {
        const response = await fetch(
          "https://tuywcrlkdkwkvdsjhidi.supabase.co/functions/v1/public-demo-order",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              customer_name:
                document.getElementById("customer-name").value,
              email:
                document.getElementById("customer-email").value,
              items: selectedProducts.map(name => ({ name }))
            })
          }
        );

        if (!response.ok) {
          throw new Error(
            "Request failed: " + response.status
          );
        }

        const data = await response.json();

        result.textContent = data.success
          ? "Success! Your practice order number is " +
            data.order_number
          : "Demo order request failed.";

      } catch (error) {
        result.textContent =
          "Error: " + error.message;
      }
    });
  </script>

</body>
</html>

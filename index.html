
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Power7 Demo Checkout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 550px;
      margin: 60px auto;
      padding: 20px;
      background: #f2f0e8;
      color: #17211c;
    }
    .checkout {
      background: white;
      padding: 30px;
      border-radius: 12px;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
    }
    button {
      background: #315c47;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="checkout">
    <h1>Power7 Demo Checkout</h1>
    <p>Practice only — no real orders or payments.</p>


<h2>Demo Products</h2>

<label>
  <input type="checkbox" name="product"
         value="Demo Product A">
  Demo Product A — $20 AUD
</label>

<label>
  <input type="checkbox" name="product"
         value="Demo Product B">
  Demo Product B — $35 AUD
</label>

<label>
  <input type="checkbox" name="product"
         value="Demo Product C">
  Demo Product C — $50 AUD
</label>

<h2>Practice Checkout</h2>

<form id="demo-form">
  <input
    id="customer-name"
    placeholder="Customer name"
    required
  >

  <input
    id="customer-email"
    type="email"
    placeholder="Email"
    required
  >

  <button type="submit">
    Submit Demo Order
  </button>
</form>


      <input id="customer-email" type="email"
             placeholder="Email" required>

      <button type="submit">Submit Demo Order</button>
    </form>

    <p id="result" role="status"></p>
  </div>

  <script>
    const form = document.getElementById("demo-form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      result.textContent = "Submitting demo order...";

      try {
        const response = await fetch(
          "https://tuywcrlkdkwkvdsjhidi.supabase.co/functions/v1/submit-order",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              customer_name:
                document.getElementById("customer-name").value,
              email:
                document.getElementById("customer-email").value,
              items: [{ name: "Demo Product A" }]
            })
          }
        );

        if (!response.ok) {
          throw new Error("Request failed: " + response.status);
        }

        const data = await response.json();

        result.textContent = data.success
          ? "Success! Demo response: " + data.order_number
          : "Demo request was unsuccessful.";
      } catch (error) {
        result.textContent = "Error: " + error.message;
      }
    });
  </script>
</body>
</html>
